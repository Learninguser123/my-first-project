apiVersion: apps/v1
kind: Deployment
metadata:
  name: hvv-mobility
  labels:
    app: hvv-mobility
    version: v1
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hvv-mobility
  template:
    metadata:
      labels:
        app: hvv-mobility
        version: v1
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: hvv-mobility
        image: ghcr.io/hvv-mobility/hvv-mobility:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "staging"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hvv-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: hvv-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: hvv-secrets
              key: jwt-secret
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: hvv-secrets
              key: api-keys
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: hvv-config
              key: log-level
        - name: API_RATE_LIMIT
          valueFrom:
            configMapKeyRef:
              name: hvv-config
              key: api-rate-limit
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: hvv-config
              key: cors-origins
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hvv-mobility
              topologyKey: kubernetes.io/hostname
      nodeSelector: {}
      tolerations: []
---
apiVersion: v1
kind: Service
metadata:
  name: hvv-mobility-service
  labels:
    app: hvv-mobility
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: hvv-mobility
---
apiVersion: v1
kind: Service
metadata:
  name: hvv-mobility-headless
  labels:
    app: hvv-mobility
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: hvv-mobility
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hvv-mobility-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hvv-mobility
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hvv-mobility-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hvv-mobility
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hvv-mobility-backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: ghcr.io/hvv-mobility/hvv-mobility:latest
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting database backup..."
              pg_dump $DATABASE_URL | gzip > /backup/hvv-backup-$(date +%Y%m%d-%H%M%S).sql.gz
              echo "Backup completed"
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hvv-secrets
                  key: database-url
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: hvv-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hvv-backup-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard